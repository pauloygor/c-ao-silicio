<!DOCTYPE html>
<html lang="pt-BR" class="papel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do C ao Silício</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=VT323&display=swap" rel="stylesheet">
<style>
/* Uma única cena em canvas ocupa a tela; a câmera mergulha de nível em nível. Dois visuais: papel e fósforo. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#111111; --mute:#8c8c8c; --line:#e4e4e4; --hot:#ff3d00;
  --ft:'Instrument Serif',Georgia,'Times New Roman',serif;
  --fm:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
html.fosforo{
  color-scheme:dark;
  --bg:#020a04; --ink:#2fdc62; --mute:#1c9447; --line:#0f5a28; --hot:#c9ffd8;
  --ft:VT323,ui-monospace,monospace; --fm:VT323,ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fm);display:flex;flex-direction:column;overflow:hidden}
html.fosforo body{text-shadow:0 0 7px rgba(60,255,120,.55)}
button,input{font:inherit;color:inherit;background:none}
:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
header{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;justify-content:space-between;padding:14px 20px 6px}
h1{font:400 1.75rem/1 var(--ft);margin:0;letter-spacing:-.01em}
html.fosforo h1{font-size:2rem;letter-spacing:.04em}
.ctl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:.95rem}
html.fosforo .ctl{font-size:1.3rem}
.ctl label{display:flex;gap:6px;align-items:baseline;color:var(--mute)}
.ctl input{width:3.2em;border:0;border-bottom:1px solid var(--ink);padding:1px 2px;text-align:center;border-radius:0;color:var(--ink)}
.ctl button{border:0;border-bottom:1px solid var(--mute);padding:1px 0;cursor:pointer;color:var(--mute)}
.ctl button:hover{color:var(--ink);border-color:var(--ink)}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default;touch-action:none}
html.fosforo .stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
footer{display:flex;gap:10px 20px;align-items:flex-end;justify-content:space-between;padding:6px 20px 16px}
.cap{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 300px}
.cap p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.cap p.open{display:block}
.cap h2{font:400 2.1rem/1.05 var(--ft);margin:0;letter-spacing:-.015em}
.cap p{font:italic 400 1.2rem/1.25 var(--ft);margin:0;max-width:46ch;text-wrap:balance}
html.fosforo .cap h2{font-size:2.4rem;letter-spacing:.03em} html.fosforo .cap p{font-style:normal;font-size:1.4rem;line-height:1.05}
.nav{display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex:none}
.zb{display:flex;gap:8px}
.pl{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 14px;font-size:.9rem;max-width:62vw}.pl label{display:flex;gap:8px;align-items:center;color:var(--mute)}.pl input[type=range]{width:120px;accent-color:var(--hot)}.pl button[aria-pressed="true"]{color:var(--hot);border-color:var(--hot)}.pl[hidden]{display:none}html.fosforo .pl{font-size:1.25rem}
.pl button{border:0;border-bottom:1px solid var(--ink);padding:2px 0;cursor:pointer}.pl button:hover{color:var(--hot);border-color:var(--hot)}
.zb button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);cursor:pointer;font-size:1.3rem;line-height:1}
html.fosforo .zb button{border-radius:0}
.zb button:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.zb button:disabled{opacity:.25;cursor:default}
#crumbs{display:flex;flex-wrap:wrap;gap:2px 6px;font-size:.82rem;letter-spacing:.04em;color:var(--mute);align-items:baseline}
html.fosforo #crumbs{font-size:1.15rem}
#crumbs button{border:0;padding:2px 0;cursor:pointer;color:var(--mute);border-bottom:1px solid transparent}
#crumbs button:hover{color:var(--ink);border-color:var(--ink)}
#crumbs button[aria-current="page"]{color:var(--hot);cursor:default}
#chal{display:flex;flex-direction:column;gap:7px;align-items:flex-start;max-width:52ch}
#chal[hidden],#capt[hidden]{display:none}
#chal .q{font:italic 400 1.25rem/1.25 var(--ft)}
html.fosforo #chal .q{font-style:normal;font-size:1.45rem;line-height:1.05}
#chal .op{display:flex;flex-wrap:wrap;gap:6px 8px}
#chal .op button{border:1px solid var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.9rem;text-align:left}
html.fosforo #chal .op button{border-radius:0;font-size:1.2rem}
#chal .op button:hover:not(:disabled){background:var(--ink);color:var(--bg)}

#chal .fb{color:var(--mute);font-size:.88rem}
#chal .ok{color:var(--hot);font:400 1.08rem/1.3 var(--ft)}
html.fosforo #chal .fb,html.fosforo #chal .ok{font-size:1.2rem;line-height:1.05}
#map .ck{color:var(--hot)}#map .rs{font:inherit;color:var(--mute);border-bottom:1px solid var(--mute)}
#map{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:22px 24px 40px}
#map[hidden]{display:none}
#map .mh{display:flex;justify-content:space-between;align-items:baseline;max-width:640px}
#map h2{font:400 2.2rem/1 var(--ft);margin:0}
#map p{color:var(--mute);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px}
html.fosforo #map p{font-size:1.1rem}
#map button{border:0;border-bottom:1px solid transparent;padding:3px 0;cursor:pointer;font:400 1.3rem/1.2 var(--ft);text-align:left}
#map button:hover{border-color:var(--ink)}
#map button[aria-current="page"]{color:var(--hot)}
#map .mh button,#map .ms button{font:inherit;border-bottom:1px solid var(--ink)}
#map .ms{display:flex;flex-wrap:wrap;gap:8px 22px}
#map ul{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line)}
#map ul.mt{padding:0;border:0}
#map li{margin:2px 0}
#asm-ed{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#asm-ed[hidden]{display:none!important}
#asm-ed .box{background:var(--bg);border:1px solid var(--ink);padding:20px 22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px}
#asm-ed h3{font:400 1.8rem/1 var(--ft);margin:0}
#asm-ed p{margin:0;font-size:.86rem;color:var(--mute);line-height:1.35}
#asm-ed textarea{width:100%;height:210px;border:1px solid var(--ink);padding:8px 10px;font:1rem/1.35 var(--fm);color:var(--ink);background:var(--bg);resize:vertical}
#asm-ed .err{color:var(--hot);font-size:.86rem;min-height:1.2em}
#asm-ed .row{display:flex;gap:12px;justify-content:flex-end}
#asm-ed button{border:1px solid var(--ink);padding:5px 14px;cursor:pointer}
#asm-ed button:hover{background:var(--ink);color:var(--bg)}
.pl input[type=range]#scrub{width:105px}
#helpb{width:1.75em;height:1.75em;border:1px solid var(--ink)!important;border-radius:50%;padding:0!important;color:var(--ink)!important;line-height:1;font-weight:500}
#helpb[aria-expanded="true"]{background:var(--ink);color:var(--bg)!important}
html.fosforo #helpb{border-radius:0}
#help{position:absolute;top:0;right:0;bottom:0;width:min(440px,94%);z-index:5;background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:16px 22px 28px;box-shadow:-14px 0 24px -20px rgba(0,0,0,.4)}
#help[hidden]{display:none}
#help .hh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
#help small{color:var(--mute);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
#help h2{font:400 2rem/1.05 var(--ft);margin:2px 0 0}
#help p{font:400 1.1rem/1.45 var(--ft);margin:0 0 12px;max-width:60ch}
#help p.s{color:var(--mute);font-size:1rem}
#help h3{font:500 1.25rem/1.2 var(--ft);margin:18px 0 6px}
#help-x{border:0;border-bottom:1px solid var(--mute);padding:1px 0;cursor:pointer;color:var(--mute)}
html.fosforo #help p{font-size:1.32rem;line-height:1.12}html.fosforo #help small{font-size:1.05rem}html.fosforo #help h2{font-size:2.2rem}
#chal .bad{color:var(--ink);font:500 1.08rem/1.3 var(--ft)}
#chal .ex{color:var(--ink);font:400 1.02rem/1.35 var(--ft)}
html.fosforo #chal .bad,html.fosforo #chal .ex{font-size:1.2rem;line-height:1.08}

#chal .rs{color:var(--mute);font-size:.82rem;margin-top:2px}#chal .rs button{border:0;border-bottom:1px solid var(--mute);padding:0;cursor:pointer;color:var(--mute)}#chal .rs button:hover{color:var(--hot);border-color:var(--hot)}
html.fosforo #chal .rs{font-size:1.1rem}
#zr{font-size:.85rem!important}#zr[hidden]{display:none}
@media (max-width:560px){
header{padding:8px 12px 2px;gap:2px 12px;flex-wrap:nowrap;flex-direction:column;align-items:stretch}h1{font-size:1.25rem}html.fosforo h1{font-size:1.5rem}
.ctl{flex-wrap:nowrap;overflow-x:auto;gap:6px 10px;font-size:.88rem;padding-bottom:4px;scrollbar-width:none}.ctl::-webkit-scrollbar,.pl::-webkit-scrollbar,#crumbs::-webkit-scrollbar{display:none}.ctl>*{flex:none}
footer{flex-direction:column;align-items:stretch;gap:6px;padding:4px 12px calc(10px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto}
#crumbs{white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-size:.8rem}
.cap{flex:none}.cap h2{font-size:1.45rem}html.fosforo .cap h2{font-size:1.7rem}
.cap p{font-size:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}.cap p.open{display:block}html.fosforo .cap p{font-size:1.15rem}
#chal{max-width:100%}#chal .q{font-size:1.1rem}#chal .op button{padding:7px 12px}
.nav{flex-direction:row;align-items:flex-end;gap:10px}
.pl{flex:1;min-width:0;max-width:none;justify-content:flex-start;gap:6px 12px}
.zb{flex:none;gap:6px}.zb button{width:40px;height:40px}
#help{width:100%;border-left:0;padding:14px 16px 24px}#help h2{font-size:1.6rem}#help p{font-size:1.02rem}
}
@media (max-width:420px){#vals{gap:4px 8px;flex-wrap:wrap;overflow:visible}#vals input{width:2.6em}}
@media (max-width:560px) and (max-height:700px){.cap h2{font-size:1.2rem}footer{max-height:50vh}}
@media (max-height:520px) and (orientation:landscape){
body{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,44%);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"stage head" "stage foot"}
header{grid-area:head;padding:8px 12px 2px;gap:2px 12px;flex-direction:column;align-items:stretch}h1{font-size:1.2rem}
.ctl{flex-wrap:nowrap;overflow-x:auto;font-size:.85rem;scrollbar-width:none}.ctl>*{flex:none}
.stage{grid-area:stage}
footer{grid-area:foot;flex-direction:column;align-items:stretch;gap:6px;padding:4px 12px 10px;overflow:auto;min-height:0}
#crumbs{white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-size:.78rem}
.cap{flex:none}.cap h2{font-size:1.3rem}.cap p{font-size:.95rem}#chal{max-width:100%}#chal .q{font-size:1.02rem}
.nav{flex-direction:row;align-items:flex-end;gap:8px}.pl{flex:1;min-width:0;max-width:none;justify-content:flex-start;gap:5px 12px;font-size:.85rem}
.zb button{width:38px;height:38px}#help{width:100%}
}
</style>
</head>
<body>
<header>
  <h1>Do C ao Silício</h1>
  <form class="ctl" id="vals">
    <label for="in-a">a <input id="in-a" type="number" min="0" max="255" value="5" inputmode="numeric"></label>
    <label for="in-b">b <input id="in-b" type="number" min="0" max="255" value="3" inputmode="numeric"></label>
    <button type="button" id="helpb" aria-expanded="false" aria-controls="help" aria-label="Como funciona esta parte">?</button>
    <button type="button" id="mapb">mapa</button>
    <button type="button" id="fs">tela cheia</button>
    <button type="button" id="theme">fósforo</button>
  </form>
</header>
<div class="stage" id="stage"><canvas id="cv" tabindex="0" role="img" aria-label="Animação do nível atual. Use os botões de zoom para mudar de nível."></canvas>
<aside id="help" hidden aria-label="Como funciona"><div class="hh"><div><small>como funciona</small><h2 id="help-t"></h2></div><button type="button" id="help-x">fechar</button></div><div id="help-c"></div></aside></div>
<div id="map" hidden role="dialog" aria-modal="true" aria-label="Mapa das cenas"></div>
<div id="asm-ed" hidden role="dialog" aria-modal="true" aria-label="Editor Assembly">
  <div class="box">
    <h3>Programa personalizado</h3>
    <p>Até 12 instruções (endereços 0..11). Variáveis fixas: <b>um</b>=12 (valor 1), <b>a</b>=13, <b>b</b>=14, <b>c</b>=15.<br>Opcodes: NOP, LDA, ADD, SUB, STA, LDI, JMP, JZ, CALL, RET, HLT. CALL e RET usam uma pilha de retorno de 4 níveis.</p>
    <textarea id="asm-txt" spellcheck="false" aria-label="Código Assembly"></textarea>
    <div class="err" id="asm-err"></div>
    <div class="row">
      <button type="button" id="asm-cancel">cancelar</button>
      <button type="button" id="asm-save">carregar programa</button>
    </div>
  </div>
</div>
<footer>
  <div class="cap" aria-live="polite">
    <nav id="crumbs" aria-label="Caminho"></nav>
    <h2 id="name"></h2>
    <p id="capt"></p>
    <div id="chal" hidden></div>
  </div>
  <div class="nav">
    <div class="pl" id="ctl"></div>
    <div class="zb">
      <button type="button" id="zr" hidden aria-label="Restaurar o enquadramento" title="restaurar o enquadramento">1:1</button>
      <button type="button" id="zout" aria-label="Afastar um nível">−</button>
      <button type="button" id="zin" aria-label="Aproximar um nível">+</button>
    </div>
  </div>
</footer>

<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#cv'),c=cv.getContext('2d'),stage=$('#stage');
const bin=(n,w=8)=>(n>>>0).toString(2).padStart(w,'0');
const fmt8=v=>{v&=255;if(S.base==='hex')return '0x'+v.toString(16).toUpperCase().padStart(2,'0');if(S.base==='sig')return String(v>127?v-256:v);return String(v);};
const baseLab=()=>S.base==='dec'?'dec':S.base==='sig'?'sinal ±':'hex';

const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const sstep=(a,b,x)=>ease((x-a)/(b-a));

const TH={
 papel:{bg:'#ffffff',ink:'#111111',dim:'#d2d2d2',mute:'#8c8c8c',hot:'#ff3d00',glow:0,gc:'transparent',mono:'"DM Mono",ui-monospace,monospace',text:'"Instrument Serif",Georgia,serif',fs:1,lay:{nd:'#9fd0aa',pd:'#ecd08f',poly:'#9a9a9a',metal:'rgba(70,120,225,.42)'}},
 fosforo:{bg:'#020a04',ink:'#2fdc62',dim:'#0f5a28',mute:'#1c9447',hot:'#c9ffd8',glow:9,gc:'rgba(70,255,130,.9)',mono:'VT323,monospace',text:'VT323,monospace',fs:1.28,lay:{nd:'rgba(47,220,98,.30)',pd:'rgba(47,220,98,.13)',poly:'rgba(47,220,98,.62)',metal:'rgba(201,255,216,.30)'}}
};
let T=TH.papel;
const S={a:5,b:3,path:[{id:'c'}],g:{a:1,b:1,cin:0},gl:{a:1,b:1,c:1},mx:{a:1,b:0,s:0},lt:{d:1,en:1,q:1,src:'manual',ck:0,ckNow:0,ckOld:0,chg:-9},sram:false,dc:{x1:0,x0:1,m:0},ff:{d:1,m:0,q:0,mode:'ms',man:false,ck:0,ckNow:0,ckOld:0,chg:-9},st:{},mv:{v:0,manual:false,p:false},dope:'n',pn:0,pnw:50,gate:'nand',ins:0x2E,in3:false,mm:{mode:'pc',sel:-1},ch:{draw:{},armed:false,on:false,res:{},last:''},prog:0,rate:1,sub:0,aluf:'add',base:'dec',cla:false,cmosTest:{on:false,p:[1,1],n:[0,0]},temp:300,pipe:false,wave:[],waveT:0};
let uz=1,upx=0,upy=0,panT=0,kbdNav=false,queue=[],anim=null,zones=[],zFocus=-1,W=800,H=800,dpr=1,k=1,ox=0,oy=0,SA=1,last=0;

/* ---------- lógica ---------- */
function addsub(a,b,sub){const be=sub?(~b&255):b,cy=[sub?1:0],s=[];for(let i=0;i<8;i++){const x=a>>i&1,y=be>>i&1,q=cy[i];s[i]=x^y^q;cy[i+1]=(x&y)|(q&(x^y));}let r=0;for(let i=0;i<8;i++)r|=s[i]<<i;return {s:r,cy,be};}
function nand9(A,B,C){const N=(x,y)=>1-(x&y),n1=N(A,B),n2=N(A,n1),n3=N(B,n1),n4=N(n2,n3),n5=N(n4,C),n6=N(n4,n5),n7=N(C,n5);return {a:A,b:B,cin:C,n1,n2,n3,n4,n5,n6,n7,s:N(n6,n7),cout:N(n1,n5)};}
function classic(A,B,C){const p=A^B,x1=p&C,x2=A&B;return {a:A,b:B,cin:C,p,x1,x2,s:p^C,cout:x1|x2};}
function loadBit(){
  const r=addsub(S.a,S.b,S.aluf==='sub'?1:0);
  S.g={a:S.a&1,b:r.be&1,cin:r.cy[0]};
  if(typeof SCN!=='undefined'&&SCN.alu&&SCN.alu.hots[1]){
    SCN.alu.hots[1].gate=ALUF[S.aluf].g||'and';
    const ar=S.aluf==='add'||S.aluf==='sub';SCN.alu.hots[0].main=ar;SCN.alu.hots[1].main=!ar;
  }
}

/* ---------- desenho ---------- */
const al=v=>{c.globalAlpha=Math.max(0,Math.min(1,SA*v));};
function Ln(pts,col,w,dash,off){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.strokeStyle=col;c.lineWidth=w||2;c.setLineDash(dash||[]);c.lineDashOffset=off||0;c.lineJoin='round';c.lineCap='round';c.stroke();c.setLineDash([]);}
function Tx(s,x,y,size,col,align,font,maxw){const f=font||T.mono,al_=align||'center';let fs=size*T.fs;c.font=`${fs}px ${f}`;
  const m=c.getTransform();if(!m.b&&!m.c&&(maxw||(BTr&&m.a===BTr.a&&m.d===BTr.d&&m.e===BTr.e&&m.f===BTr.f))){const av=maxw||(al_==='center'?2*Math.min(x,800-x):al_==='right'?x:800-x)-4;if(av>0){const w=c.measureText(s).width;if(w>av){fs=Math.max(fs*.6,fs*av/w);c.font=`${fs}px ${f}`;}}}
  c.fillStyle=col||T.ink;c.textAlign=al_;c.textBaseline='middle';c.fillText(s,x,y);}
function Rc(x,y,w,h,col,lw,fill){if(fill){c.fillStyle=fill;c.fillRect(x,y,w,h);}if(col){c.strokeStyle=col;c.lineWidth=lw||2;c.strokeRect(x,y,w,h);}}
function Ci(x,y,r,col,lw,fill){c.beginPath();c.arc(x,y,r,0,7);if(fill){c.fillStyle=fill;c.fill();}if(col){c.strokeStyle=col;c.lineWidth=lw||2;c.stroke();}}
function along(pts,f){let tot=0;const sg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);sg.push(d);tot+=d;}let d=Math.max(0,Math.min(1,f))*tot;for(let i=0;i<sg.length;i++){if(d<=sg[i]||i===sg.length-1){const q=sg[i]?d/sg[i]:0;return [pts[i][0]+(pts[i+1][0]-pts[i][0])*q,pts[i][1]+(pts[i+1][1]-pts[i][1])*q];}d-=sg[i];}return pts[0];}
function noGlow(f){const b=c.shadowBlur;c.shadowBlur=0;f();c.shadowBlur=b;}

  const mcu=S.mm.mode==='mcu',st=MM_STEP.length,per=2.6,k=Math.min(st-1,Math.floor((t%(st*per)+.01)/per)),S_=MM_STEP[k],L=mmLayout(mcu),R=L.R;
  const selReg=S.mm.sel>=0?MM_SRC[S.mm.sel][1]:null,hotReg={0:['text','rodata','data','bss','dataI'],1:['stack'],2:['stack'],3:['heap','stack'],4:['stack'],5:['stack'],6:['stack','heap'],7:['bss'],8:['stack']}[k];
  Tx('Onde moram as variáveis de um programa C',400,44,26,T.ink,'center',T.text);
  // código
  MM_SRC.forEach(([s,reg],i)=>{const y=122+i*31,on=S_.l.includes(i),sel=i===S.mm.sel;if(!s)return;
    if(sel)Rc(30,y-14,420,28,T.hot,1.4);Tx(s,38,y,17,on?T.hot:T.ink,'left',T.mono,404);
    if(live&&reg)zones.push({x:240,y,r:14,box:[30,y-14,420,28],fn(){S.mm.sel=S.mm.sel===i?-1:i;}});});
  // colunas
  L.cols.forEach(([n,x,w])=>Tx(n,x+w/2,92,15,T.mute,'center',T.text));
  if(!mcu){Tx('0xFFFF',770,105,10,T.mute,'right',T.mono);Tx('0x0000',770,661,10,T.mute,'right',T.mono);}
  const reg=(key,lab)=>{const [x,y,w,h]=R[key],on=hotReg.includes(key)||selReg===key||(key==='dataI'&&selReg==='data');
    Rc(x,y,w,h,on?T.hot:T.ink,on?2.4:1.2,T.bg);Tx(lab||key,x+8,y+12,12,on?T.hot:T.mute,'left',T.mono,w-16);};
  const cell=(key,row,s,hot)=>{const [x,y,w]=R[key];Tx(s,x+12,y+30+row*20,14,hot?T.hot:T.ink,'left',T.mono,w-20);};
  ['stack','heap','bss','data','rodata','text'].forEach(r=>reg(r));if(mcu)reg('dataI','data (valor inicial)');
  { const [x,y,w,h]=R.free;noGlow(()=>RcD(x,y,w,h,T.dim,1,[5,5]));Tx('↓ a pilha cresce',x+w/2,y+18,12,T.mute,'center',T.text);Tx('↑ o heap cresce',x+w/2,y+h-14,12,T.mute,'center',T.text);}
  cell('text',0,'main()   soma()');cell('rodata',0,'msg = "pronto"');
  cell('data',0,'total = 5',k===0);cell('bss',0,`contador = ${k>=7?1:0}`,k===7||k===0);
  if(mcu){cell('dataI',0,'total = 5');const a=R.dataI,b=R.data,ya=a[1]+a[3]/2,yb=b[1]+b[3]/2;Ln([[a[0]+a[2],ya],[623,ya],[623,yb],[b[0],yb]],k===0?T.hot:T.dim,k===0?2:1.2);Ln([[b[0]-7,yb-5],[b[0],yb],[b[0]-7,yb+5]],k===0?T.hot:T.dim,1.2);
    Tx('cópia no boot',548,ya-34,12,k===0?T.hot:T.mute,'center',T.text);Tx('zerada no boot',R.bss[0]+R.bss[2]-8,R.bss[1]+R.bss[3]-10,11,k===0?T.hot:T.mute,'right',T.text);}
  // heap
  if(k>=3){const [x,y,w]=R.heap;Rc(x+10,y+22,Math.min(130,w-20),28,k===3||k===6?T.hot:T.ink,1.6,T.bg);Tx(`*p = ${k>=6?7:'?'}`,x+18,y+36,14,k===6?T.hot:T.ink,'left',T.mono,Math.min(130,w-20)-14);}
  // pilha: quadros
  const [sx,sy,sw]=R.stack;let py=null;
  if(k>=1&&k<=7){const fy=sy+22,on=k<=3;Rc(sx+8,fy,sw-16,64,on?T.hot:T.ink,on?2:1.2);Tx('quadro de main',sx+sw-14,fy+11,11,T.mute,'right',T.text,sw-60);
    Tx(`a = ${k>=2?2:'?'}`,sx+18,fy+30,14,k===2?T.hot:T.ink,'left',T.mono,sw-36);Tx(`p = ${k>=3?'→ heap':'?'}`,sx+18,fy+50,14,k===3?T.hot:T.ink,'left',T.mono,sw-36);py=fy+50;}
  if(k===4||k===5){const fy=sy+92,on=true;Rc(sx+8,fy,sw-16,80,T.hot,2);Tx('quadro de soma',sx+sw-14,fy+11,11,T.mute,'right',T.text,sw-60);
    Tx('volta → main',sx+18,fy+30,13,T.ink,'left',T.mono,sw-36);Tx('x = 2   y = 5',sx+18,fy+48,14,T.ink,'left',T.mono,sw-36);Tx(`r = ${k>=5?7:'?'}`,sx+18,fy+66,14,k===5?T.hot:T.ink,'left',T.mono,sw-36);}
  if(k===6){const fy=sy+92;noGlow(()=>RcD(sx+8,fy,sw-16,80,T.dim,1.2,[4,4]));Tx('quadro liberado',sx+sw/2,fy+40,13,T.mute,'center',T.text);}
  if(py!==null&&k>=3){const hx=R.heap[0]+10+Math.min(130,R.heap[2]-20),hy=R.heap[1]+36,xr=R.stack[0]+R.stack[2]+12,c_=k===3?T.hot:T.mute;
    Ln([[sx+sw-8,py],[xr,py],[xr,hy],[hx+6,hy]],c_,1.4);Ln([[hx+13,hy-5],[hx+6,hy],[hx+13,hy+5]],c_,1.4);}
  // texto
  const txt=selReg?MM_REG[selReg]+(mcu&&(selReg==='text'||selReg==='rodata')?' Num microcontrolador, fica na flash.':mcu&&selReg==='data'?' O valor inicial fica na flash e é copiado para a RAM no boot.':''):(mcu&&S_.m?S_.m:S_.t);
  const nl=TxW(selReg?txt:`${k+1}/${st}  ${txt}`,690,16,selReg?T.hot:T.ink,740);
  TxW(selReg?'toque na linha de novo para voltar à execução':'toque numa linha do código para ver em que região ela mora',690+nl*22+8,13,T.mute);
}

const EXPL={
 c:`<p>Para o processador, um programa em C é só texto. O compilador o traduz em etapas: a análise léxica separa os símbolos, a sintática os organiza em uma árvore que respeita a precedência das operações, e a geração de código transforma cada operação em instruções de máquina.</p><p>Na montagem, cada mnemônico vira um opcode de 4 bits e cada nome vira um endereço: a mora no 13, b no 14 e c no 15. Para a máquina, o nome não existe.</p><p>As variáveis são uint8_t, de 0 a 255. Uma soma que passa de 255 perde o nono bit, e c guarda só os 8 bits de baixo.</p><p>Nos programas com desvio, comparar é subtrair: o if vira um JZ, que salta quando o resultado deu zero, e o fim de um laço vira um JMP de volta ao teste.</p><p class="s">Simplificação: faltam o pré-processamento, a análise semântica, a otimização e a ligação.</p><p>No programa função, o argumento passa pelo acumulador: LDA a o carrega, CALL salta para a função, e o resultado volta no próprio acumulador. Dentro da função, x + x precisa de um endereço temporário, t, porque ADD só soma o acumulador com a memória.</p>`,
 cpu:`<p>Toda instrução passa pelo mesmo ciclo. Na busca, o PC fornece o endereço, a memória entrega o byte ao registrador de instrução e o PC avança. Na decodificação, a unidade de controle lê os 4 bits de opcode. Na execução, ela comanda as transferências que a instrução pede.</p><p>Cada instrução ocupa 1 byte: 4 bits de opcode e 4 de operando, que é um endereço ou uma constante de 0 a 15. Instruções e dados ficam na mesma memória; um byte só é tratado como instrução quando o PC aponta para ele.</p><p>O acumulador guarda um operando e recebe os resultados. A flag Z vale 1 quando ele é zero, e é ela que o JZ consulta para decidir se desvia.</p><p>No modo pipeline, etapas de instruções vizinhas se sobrepõem: enquanto uma executa, a seguinte é decodificada e a outra buscada. Um desvio tomado descarta o que foi buscado à frente.</p><p class="s">Simplificação: 8 bits, 16 bytes de memória e um único acumulador. O pipeline é ilustrativo: as micro-operações continuam mostradas em sequência.</p><h3>Funções: CALL e RET</h3><p>No programa função, CALL 5 faz duas coisas: guarda na pilha de retorno o endereço que o PC já aponta, o 2, e coloca 5 no PC. No fim da função, RET tira o 2 do topo da pilha e o devolve ao PC, e a execução continua logo depois da chamada.</p><p>Aqui a pilha de retorno fica dentro do processador e tem 4 níveis, como em microcontroladores PIC. Num PC, a pilha fica na RAM, apontada por um registrador, o SP, e guarda também os parâmetros e as variáveis locais de cada chamada: veja o mapa de memória, a partir da cena Memória.</p>`,
 datapath:`<p>Os registradores se comunicam por três barramentos. A e B levam operandos à ALU; C traz o resultado de volta. São dois de leitura porque a ALU precisa de dois operandos no mesmo ciclo.</p><p>Cada barramento é escolhido por um decodificador comandado pela unidade de controle. O Dec. A liga a saída de um registrador ao barramento A, o Dec. B faz o mesmo no B, e o Dec. C escolhe quem será gravado na próxima borda do relógio.</p><p>A memória usa os mesmos barramentos: o endereço sai pelo A, o dado a gravar pelo B, e o dado lido entra no C por um multiplexador que escolhe entre a ALU e a memória.</p><p>Uma micro-operação é o que cabe em um ciclo de clock. Um ADD gasta seis: duas de busca, uma de decodificação e três de execução. T0 e T1 são temporários que o programador não enxerga.</p><p>No CALL e no RET, o PC troca o endereço de volta direto com a pilha de retorno, sem passar pela ALU.</p><p class="s">Organização adaptada do computador ARC de Murdocca e Heuring.</p>`,
 mem:`<p>A memória é uma matriz de células de 1 bit. O endereço entra em um decodificador, que acende uma única linha; os 8 bits daquela linha saem pelas colunas como dado.</p><p>Com 4 bits de endereço há 2⁴ = 16 linhas. Cada byte pode ser instrução ou dado: a diferença está só em quem o lê.</p><p class="s">Simplificação: cada célula aparece como um latch. Uma SRAM real usa 6 transistores por bit, e uma DRAM usa 1 transistor e 1 capacitor.</p>`,
 reg:`<p>Um registrador de 8 bits são oito flip-flops D lado a lado, no mesmo relógio. Entre um pulso e outro as entradas D podem mudar livremente; as saídas Q só copiam D no pulso.</p><p>É isso que sincroniza o processador: todos os registradores mudam no mesmo instante, e entre duas bordas os circuitos combinacionais têm tempo de calcular o valor seguinte.</p>`,
 ff:`<p>Um flip-flop D captura a entrada só na borda do relógio. Há duas construções clássicas.</p><p>Mestre-escravo: dois latches em série, com o relógio invertido entre eles. Com o relógio em 0, o mestre copia D e o escravo fica fechado; na subida, o mestre fecha e o escravo entrega o valor guardado. Como os dois nunca ficam abertos juntos, D só atravessa na borda.</p><p>Detector de borda: uma porta AND recebe o relógio e uma cópia dele invertida e atrasada por inversores. Logo após a subida, durante o atraso, as duas entradas valem 1 e a AND gera um pulso curto. Esse pulso é o enable de um único latch, que fica aberto só por esse instante.</p><p>Nas duas, mudar D fora da borda não altera Q.</p>`,
 latch:`<p>O latch D é sensível ao nível, não à borda. Com EN em 1 ele é transparente: Q segue D a cada mudança. Com EN em 0, as portas 3 e 4 formam um laço que se sustenta sozinho e guarda o último valor.</p><p>As portas 1 e 2 controlam a entrada; as portas 3 e 4 guardam o bit. São 4 NAND, ou 16 transistores.</p><p>Com o enable vindo do detector de borda, o latch só abre durante um pulso curto após cada subida do relógio, e passa a se comportar como flip-flop.</p><h3>Célula SRAM de 6 transistores</h3><p>A SRAM guarda o bit em dois inversores ligados em anel, com 4 transistores: a saída de um alimenta a entrada do outro, e os dois se sustentam em estados opostos, Q e ¬Q, enquanto houver alimentação.</p><p>Dois transistores de acesso, nMOS, ligam esse anel às bitlines BL e ¬BL. Eles só conduzem quando a wordline, a linha escolhida pelo decodificador de endereço, está em 1. Na leitura, as bitlines são pré-carregadas e o anel puxa uma delas para baixo; um amplificador detecta a diferença. Na escrita, o circuito de escrita força BL e ¬BL com valores opostos, mais fortes que os inversores, e o anel troca de estado.</p><p>São 6 transistores contra 16 do latch de NAND porque não há lógica de enable: a seleção é feita pela wordline, e o dado entra e sai pelas próprias bitlines. A DRAM vai além, com 1 transistor e 1 capacitor por bit, mas a carga vaza e precisa ser reescrita milhares de vezes por segundo.</p>`,
 uc:`<p>A unidade de controle transforma o opcode em sinais de comando, um passo de cada vez. O decodificador identifica a instrução, e um contador de passos (T1, T2, T3) marca em que ponto dela o processador está; a combinação dos dois define quais sinais ficam ligados.</p><p>T1 é a busca e é igual para todas as instruções, porque a UC ainda não sabe qual instrução está chegando. A partir de T2, cada uma tem sua sequência.</p><p class="s">Na cena do Processador a decodificação aparece como etapa separada, para ser vista. Aqui, como o decodificador é combinacional, ela acontece no fim de T1, e T2 já é execução. A cena usa o programa da soma.</p>`,
 dec:`<p>Um decodificador de n entradas tem 2ⁿ saídas, e só uma fica em 1 por vez. Os inversores geram as entradas negadas, e cada porta AND recebe uma combinação diferente: só a que corresponde ao código de entrada vê todas as suas entradas em 1.</p><p>O mesmo circuito escolhe a linha da memória pelo endereço, a instrução pelo opcode e o registrador ligado a cada barramento.</p>`,
 pc:`<p>O contador de programa é um registrador cuja saída passa por um somador de +1 e volta à entrada. A cada busca, ele passa a apontar para a instrução seguinte.</p><p>Nos desvios, a unidade de controle escolhe outra fonte: em vez do valor incrementado, o PC recebe o operando da instrução.</p><p>Com 4 bits, depois de 1111 vem 0000: o vai-um se perde e a contagem recomeça.</p>`,
 alu:`<p>A ALU tem oito fatias de 1 bit. Cada uma contém uma parte aritmética, um somador completo, e uma parte lógica, com as portas; um seletor comandado pela unidade de controle escolhe qual delas entrega o resultado.</p><p>Na soma, o vai-um passa de uma fatia para a seguinte, do bit 0 ao 7, e o resultado só fica pronto quando ele chega ao fim. Esse atraso limita a frequência do processador. Nas operações lógicas não há vai-um: os 8 bits saem juntos.</p><h3>Vai-um antecipado (CLA)</h3><p>No somador em cascata, cada fatia espera o vai-um da anterior, e o tempo cresce com o número de bits. O vai-um antecipado, ou carry look-ahead, calcula todos os vai-uns direto das entradas, sem espera.</p><p>Cada fatia produz dois sinais que não dependem de ninguém: G = A·B, gera, porque com as duas entradas em 1 sai vai-um de qualquer jeito; e P = A ⊕ B, propaga, porque com uma entrada em 1 o vai-um que chega passa adiante. Daí C1 = G0 + P0·C0, C2 = G1 + P1·G0 + P1·P0·C0, e assim por diante. Cada Ci vira uma soma de produtos das entradas, calculada por duas camadas de portas, ao mesmo tempo para todos os bits.</p><p>O preço é área: as expressões crescem a cada bit. Por isso somadores largos encadeiam blocos CLA de 4 bits.</p><p>Para subtrair, a ALU inverte B e entra com vai-um 1: A − B = A + ¬B + 1, a soma do complemento de dois. Um único fio, SUB, faz as duas coisas: ele entra numa XOR em cada bit de B, que inverte B quando SUB = 1, e é o próprio vai-um de entrada. Esse fio vem do bit 4 da instrução, o único que separa ADD de SUB.</p><p>As flags resumem o resultado. Z vale 1 quando os 8 bits são zero; N copia o bit 7, que é o sinal; C é o vai-um final. Na soma, C = 1 indica estouro sem sinal; na subtração, indica que não houve empréstimo.</p>`,
 flags:`<p>As flags são bits calculados a partir do resultado da ALU e guardados para que as instruções seguintes possam decidir.</p><p>Z, zero, vale 1 quando os 8 bits do resultado são 0. É uma NOR de 8 entradas: uma árvore de 7 portas OR junta os bits, e um inversor no fim dá 1 só quando nenhum deles é 1.</p><p>N, negativo, é uma cópia do bit 7, que é o sinal quando o número é lido em complemento de dois. C, vai-um, é o vai-um que sai do bit 7.</p><p>V, estouro com sinal, é o XOR entre o vai-um que entra no bit 7 e o que sai dele. Vale 1 quando dois números de mesmo sinal produzem um resultado de sinal oposto: 100 + 100 = 200, que lido com sinal vira −56.</p><p>C e V respondem a perguntas diferentes. C diz se o resultado sem sinal estourou; V, se o resultado com sinal estourou. O processador calcula os dois, e o programa consulta o que corresponde ao tipo da variável.</p><p class="s">No simulador só o JZ consulta uma flag. Processadores reais têm um desvio para cada flag.</p>`,
 fa:`<p>O somador completo soma três bits, A, B e o vai-um de entrada, e entrega dois: a soma S e o vai-um de saída Cout.</p><p>S = A ⊕ B ⊕ Cin vale 1 quando um número ímpar de entradas está em 1. Cout = A·B + Cin·(A ⊕ B) vale 1 quando pelo menos duas estão em 1: é a função maioria.</p><p>O circuito clássico usa duas XOR, duas AND e uma OR.</p>`,
 nand:`<p>O mesmo somador, só com portas NAND. Trocar cada porta pelo seu equivalente custa 15 NAND. Inversores em sequência se anulam, e sobram 11. Por fim, as portas 1 e 5 passam a servir tanto ao cálculo de S quanto ao de Cout, e o circuito fica com 9 NAND, ou 36 transistores.</p><p class="s">Somadores CMOS industriais otimizados usam 28 transistores.</p>`,
 portas:`<p>A NAND é universal: qualquer função lógica pode ser montada só com ela. NOT é uma NAND com as entradas unidas; AND é uma NAND seguida de NOT; OR é a NAND das entradas invertidas, pelo teorema de De Morgan: A + B = ¬(¬A · ¬B).</p><p>Ela serve de base porque é a porta mais simples de fabricar em CMOS, com 4 transistores, e porque um único tipo de célula simplifica o projeto do chip.</p>`,
 mux:`<p>O multiplexador é uma chave feita de portas: a seleção S decide qual sinal chega à saída. Saída = A·¬S + B·S.</p><p>Com S = 0, o inversor libera a AND de A e bloqueia a de B; com S = 1, o contrário. A entrada bloqueada não influencia a saída, qualquer que seja seu valor.</p><p>No caminho de dados, um multiplexador escolhe o que entra no barramento C: o resultado da ALU ou o dado lido da memória.</p>`,
 cmos:`<p>Em CMOS o transistor é uma chave controlada por tensão. O nMOS conduz com 1 na porta; o pMOS, marcado pela bolinha, conduz com 0.</p><p>Toda porta tem duas redes complementares: pMOS em cima, ligando a saída a VDD, e nMOS embaixo, ligando-a ao GND. Na NAND os pMOS ficam em paralelo e os nMOS em série: a saída só vai a 0 com A e B em 1. Na NOR é o inverso.</p><p>Como uma das redes está sempre aberta, quase não há corrente parada. E todo estágio CMOS simples é inversor: AND e OR precisam de uma NAND ou NOR seguida de NOT.</p><p>No modo de defeito, conduzir as duas redes juntas liga VDD ao GND (curto, X); abrir as duas deixa a saída flutuando (alta impedância, Z).</p><h3>XOR e portas de 3 entradas</h3><p>XOR e XNOR têm célula própria: dois inversores geram ¬A e ¬B, e uma rede de 8 transistores combina as quatro entradas. São 12 transistores, contra 16 de uma XOR montada com 4 NAND e 20 de uma XNOR com 5. Bibliotecas reais têm variantes ainda menores.</p><p>Uma NAND de 3 entradas tem 3 pMOS em paralelo e 3 nMOS em série, 6 transistores. Cada transistor a mais em série aumenta a resistência do caminho e deixa a porta mais lenta. Por isso, para juntar muitos sinais, como os 8 bits do Z, usa-se uma árvore de portas pequenas.</p><p>O CMOS também tolera ruído: a saída está sempre ligada com firmeza a VDD ou a GND, e uma pequena variação na entrada não muda qual rede conduz.</p>`,
 layout:`<p>A mesma porta vista de cima, no silício. A faixa de difusão P, dentro do poço N, abriga os pMOS; a faixa de difusão N abriga os nMOS. As tiras verticais de polissilício são as entradas.</p><p>Onde o polissilício cruza uma difusão existe um transistor. Uma faixa cruzada por duas tiras forma dois transistores em série; contatos e metal ligam as difusões a VDD, ao GND e à saída.</p><p class="s">Simplificação: o desenho não segue regras de projeto e omite os contatos de poço e substrato.</p>`,
 mosfet:`<p>No nMOS, fonte e dreno são regiões tipo N em um substrato tipo P. Entre elas, uma camada fina de óxido isola a porta de polissilício, que funciona como a placa de um capacitor.</p><p>Abaixo da tensão de limiar Vth, as lacunas sob o óxido são repelidas e forma-se uma região de depleção, mas não há caminho entre fonte e dreno. Acima de Vth, o campo atrai elétrons suficientes para formar um canal tipo N, e a corrente passa. Quanto maior VGS, mais forte o canal.</p><p>O pMOS é o espelho: regiões P em um poço N, canal de lacunas, condução com VGS negativo.</p><p class="s">Simplificação: curva quadrática ideal, com Vth = 1 V e VDD = 5 V. Os chips atuais trabalham perto de 1 V, e o transistor é tridimensional: no FinFET, o canal é uma barbatana vertical abraçada pela porta por três lados, o que dá mais controle sobre a corrente em dimensões de poucos nanômetros.</p>`,
 pn:`<p>Onde o silício N encontra o P, elétrons e lacunas se recombinam e deixam uma faixa sem portadores livres, a depleção. Nela ficam só os íons fixos, positivos do lado N e negativos do lado P, que criam um campo contrário à difusão.</p><p>Na polarização direta, com o positivo no lado P, a barreira diminui: elétrons do N e lacunas do P chegam à junção e se recombinam, e a corrente flui. Na reversa, a barreira cresce e só passa uma pequena corrente de fuga. É o diodo.</p><p>No fio metálico só se movem elétrons; a lacuna existe apenas dentro do semicondutor.</p><p>A corrente de fuga vem de pares elétron-lacuna gerados pelo calor dentro da depleção, e cresce depressa com a temperatura.</p>`,
 fab:`<p>O transistor é construído em camadas sobre um disco de silício. Um forno faz crescer o óxido isolante; deposita-se o polissilício da porta; uma resina fotossensível é exposta à luz ultravioleta através de uma máscara, e as áreas não protegidas são removidas.</p><p>Depois, íons de fósforo são implantados. A porta já pronta bloqueia os íons sobre o canal, e por isso fonte e dreno ficam alinhados com ela sem outra máscara: é o processo autoalinhado. Por fim, o metal faz as ligações.</p><p class="s">Simplificação: faltam a remoção da resina, o recozimento, o isolamento entre transistores e as várias camadas de metal.</p>`,
 silicio:`<p>Cada átomo de silício faz quatro ligações com os vizinhos, e todos os elétrons de valência ficam presos nelas: o silício puro quase não conduz. O calor solta alguns, e cada elétron solto deixa uma lacuna para trás.</p><p>Dopar é trocar um átomo em milhões. O fósforo, com 5 elétrons, deixa um elétron sobrando: tipo N. O boro, com 3, deixa uma ligação incompleta, a lacuna: tipo P. Entre os polos, elétrons vão para o positivo, e as lacunas, que se comportam como cargas positivas, vão para o negativo.</p><p>Perto de 0 K os portadores ficam presos aos dopantes. Em temperaturas muito altas, por volta de 550 K para dopagens típicas, os pares gerados pelo calor superam os do dopante e o controle se perde. Chips comerciais operam até cerca de 400 K.</p><p class="s">Simplificação: a rede real é tridimensional e tetraédrica.</p>`,
 mapa:`<p>Um programa C em execução divide a memória em regiões, cada uma com uma regra de vida.</p><p>Em <b>text</b> fica o código de máquina das funções, e em <b>rodata</b>, as constantes, como os textos entre aspas; as duas são só leitura. Em <b>data</b> ficam as globais com valor inicial, e em <b>bss</b>, as globais sem valor inicial, zeradas antes do main. Essas quatro existem do início ao fim do programa.</p><p>A <b>pilha</b> guarda as variáveis locais e o endereço de volta de cada chamada. Cada função que começa ganha um quadro, e o quadro é liberado no return; por isso uma variável local não guarda valor entre chamadas e começa com lixo. O <b>heap</b> guarda o que o programa pede com malloc, e o bloco só é liberado com free; esquecer o free é um vazamento de memória. A pilha cresce para baixo e o heap para cima, um em direção ao outro.</p><p>Num microcontrolador não há sistema operacional. text, rodata e o valor inicial das globais ficam na flash, que não perde o conteúdo sem energia. Ao ligar, o código de partida copia os valores de data da flash para a RAM e zera bss, antes de chamar o main.</p><p class="s">Os endereços são ilustrativos. A ordem real das regiões varia com o sistema e o compilador.</p>`,
 instr:`<p>Para o processador, a instrução é só um número de 8 bits, dividido em campos. Os 4 bits de cima são o opcode, que diz o que fazer; os 4 de baixo são o operando, que diz com quem: um endereço da memória, um número ou o destino de um salto.</p><p>Cada bit é um fio, com tensão alta para 1 e baixa para 0. Os fios do opcode entram num decodificador de 4 para 16, que acende uma única linha: a da instrução. Os fios do operando seguem para o endereço da memória.</p><p>ADD é 0010 e SUB é 0011: diferem só no bit 4. A unidade de controle aproveita isso, e esse bit vira o fio SUB da ALU, que inverte B e põe 1 no vai-um de entrada. Trocar o operando de 1110 para 1111 faz ADD b virar ADD c.</p><p class="s">Processadores reais usam instruções de 16, 32 ou mais bits, com mais campos: vários registradores de origem e destino e bits extras que refinam a operação. A ideia é a mesma.</p>`,
 escala:`<p>O simulador mostra a soma passo a passo, mas num chip ela é muito rápida. Uma porta lógica leva alguns picossegundos para responder; usamos 10 ps como ordem de grandeza.</p><p>No somador em cascata, o vai-um atravessa duas portas por bit: 8 bits custam cerca de 16 atrasos, e 32 bits, cerca de 64. Com o vai-um antecipado, o caminho cai para cerca de 4 atrasos. A 3 GHz, um ciclo dura 333 ps, e todo caminho entre dois registradores precisa caber nele. Nesse tempo, a luz percorre só 10 cm.</p><p>O processador deste simulador tem, por estimativa, cerca de 3.700 transistores, contando a memória como SRAM 6T. É a escala do Intel 4004, de 1971, com 2.300. Um chip atual, como o Apple M3 Max, tem 92 bilhões.</p><p class="s">Os atrasos são aproximados: dependem da tecnologia, da carga de cada porta e do comprimento dos fios.</p>`,
 chip:`<p>No chip, cada porta é desenhada uma vez, como uma célula padrão: uma peça de altura fixa, com os pMOS perto do trilho de VDD e os nMOS perto do GND. Uma biblioteca tem centenas delas: inversores, NAND, NOR, XOR, flip-flops.</p><p>As células se encaixam lado a lado em fileiras, como peças de Lego, e os trilhos de alimentação correm pela fileira inteira. Fileiras vizinhas são espelhadas para dividir o mesmo trilho.</p><p>As células formam macrocélulas, ou blocos: o nosso somador de 8 bits são 8 fileiras de 5 células. Os blocos formam núcleos, e os núcleos, o chip. Num processador real, um somador de 32 bits tem cerca de 160 células, e um multiplicador de 32 bits, cerca de 6.100.</p><p class="s">O nosso while multiplica por somas sucessivas, em software. O processador real tem um circuito multiplicador próprio, que faz a conta num único ciclo ou em poucos.</p>`,
 fios:`<p>Os transistores ocupam só a superfície do silício. As ligações entre eles sobem para camadas de metal empilhadas, separadas por isolante, o dielétrico.</p><p>As camadas de baixo, a interconexão local e o M1, são finas e densas, e ligam transistores e células vizinhas. Quanto mais alta a camada, mais grossos e longos os fios: no topo correm a alimentação e o relógio, que atravessam o chip inteiro. As vias são furos verticais cheios de metal que ligam uma camada à outra.</p><p>Um processador atual tem cerca de 15 a 17 camadas de metal e quilômetros de fio. Na fabricação, cada camada é feita com a mesma sequência de fotolitografia e corrosão, repetida dezenas de vezes.</p>`,
 atomo:`<p>Só os elétrons da última camada, os de valência, participam das ligações. O silício tem 4 e forma quatro ligações. O fósforo tem 5: um fica sem par e se solta. O boro tem 3: falta um elétron para completar as ligações, e essa falta é a lacuna.</p><p>É o fim da descida. Aqui não existe 5, nem 3, nem 8: só cargas, tensões e chaves que abrem e fecham porque outras abriram e fecharam antes. A soma não mora no chip, mas no jeito como os transistores foram organizados. Quem enxerga o 8 somos nós.</p>`

function ctlAct(act,v){const st=clk(cur());const resume=act==='pp'&&!(st.run&&!st.until);if(cur()==='dec'&&(['step','prev','dcauto'].includes(act)||resume))S.dc.m=0;if(cur()==='ff'&&!S.ch.on&&(['step','prev'].includes(act)||resume))S.ff.man=false;if(cur()==='mapa'&&['pp','step','prev'].includes(act))S.mm.sel=-1;if(act==='prev')S.wave=[];
  switch(act){case 'pp':st.run=!(st.run&&!st.until);st.until=0;break;case 'step':if(DUR[cur()])stepNow(cur());break;case 'prev':if(DUR[cur()])stepPrev(cur());break;case 'mtype':S.mv.p=!S.mv.p;break;case 'mauto':S.mv.manual=false;break;case 'dope':S.dope=v;break;case 'pn':S.pn=+v;break;case 'gate':S.gate=v;S.cmosTest.on=false;break;case 'cmostest':S.cmosTest.on=!S.cmosTest.on;if(S.cmosTest.on){const A=S.gl.a,B=S.gl.b;S.cmosTest.p=[1-A,1-B];S.cmosTest.n=[A,B];}break;case 'cla':S.cla=!S.cla;clk('alu').t=clk('alu').run?0:aluReady();clk('alu').until=0;break;case 'pipe':S.pipe=!S.pipe;break;case 'in3':S.in3=!S.in3;break;case 'mmmode':S.mm.mode=v;break;case 'dcauto':st.run=true;st.until=0;break;case 'ffmode':S.ff.mode=v;S.wave=[];Object.assign(SCN.ff.hots[0],v==='pulso'?{x:440,y:270}:{x:200,y:270});break;case 'ffclk':if(!S.ff.man)S.ff.ck=S.ff.ckNow;S.ff.man=!S.ff.man;break;case 'ltsrc':S.lt.src=S.lt.src==='borda'?'manual':'borda';S.lt.ck=0;S.wave=[];break;case 'sram':S.sram=!S.sram;S.wave=[];applyLayout();break;case 'base':S.base=S.base==='dec'?'sig':S.base==='sig'?'hex':'dec';break;case 'editasm':openAsmEd();return;case 'op':S.aluf=v;loadBit();clk('alu').t=clk('alu').run?0:aluReady();clk('alu').until=0;break;case 'prog':setProg(+v);break;case 'rate':S.rate=S.rate>=4?1:S.rate*2;break;case 'chal':S.ch.on=!S.ch.on;if(S.ch.on)chFreeze();else chThaw();chrome();return;}
  syncUrl();renderCtl();}
/* mapa */
function mapHtml(){const seen=new Set(),walk=id=>{seen.add(id);const kids=SCN[id].hots.map(h=>h.to).filter(k=>!seen.has(k)&&seen.add(k));
    return `<li><button type="button" data-go="${id}"${id===cur()?' aria-current="page"':''}>${SCN[id].n}${S.ch.res[id]?(S.ch.res[id].ok?' <span class="ck">✓</span>':' <span class="ck">✗</span>'):''}</button>${kids.length?'<ul>'+kids.map(walk).join('')+'</ul>':''}</li>`;};
  return `<div class="mh"><h2>Mapa</h2><button type="button" data-close="1">fechar</button></div><p>Começar por disciplina</p><div class="ms">${[['Programação','c'],['Arquitetura de computadores','cpu'],['Eletrônica digital','fa'],['Fundamentos da eletrônica','mosfet']].map(([n,id])=>`<button type="button" data-go="${id}">${n}</button>`).join('')}</div><p>Todas as cenas · ${nDone()} de ${nTot()} desafios respondidos · ${nOk()} certos</p><ul class="mt">${walk('c')}</ul><p><button type="button" data-reset="1" class="rs">refazer desafios</button></p>`;}
function openMap(o){const m=$('#map');if(o&&m.hidden)dlgRet=document.activeElement;const was=!m.hidden;m.hidden=!o;if(!o&&was)dlgBack();if(o){m.innerHTML=mapHtml();const b=m.querySelector('[aria-current]');if(b)b.focus();}}
function jumpTo(id){const p=findPath(id);if(!p)return;queue=[];anim=null;S.path=p;S.wave=[];zFocus=-1;const q=clk(id);q.t=0;q.until=0;chrome();}
function zin(h){if(anim||queue.length)return;S.wave=[];zFocus=-1;h=h||SCN[cur()].hots.find(x=>x.main)||SCN[cur()].hots[0];if(h){if(h.gate){S.gate=h.gate;S.cmosTest.on=false;}const q=clk(h.to);q.t=0;q.until=0;queue.push({hot:h});}}
function bfsPath(from,id,ban){const seen=new Set(ban),q=[[from,[]]];seen.add(from);while(q.length){const [at,tr]=q.shift();if(at===id)return tr;for(const h of SCN[at].hots){if(seen.has(h.to))continue;seen.add(h.to);q.push([h.to,tr.concat({id:h.to,hot:h})]);}}return null;}
function goTo(id){if(anim||queue.length)return jumpTo(id);if(id===cur()||!SCN[id])return;
  // 1) destino abaixo da cena atual: entra direto; 2) senão, recua até o ancestral comum com o caminho principal
  let best=null;const sub=bfsPath(cur(),id,S.path.map(e=>e.id));if(sub)best={c:sub.length,outs:0,ins:sub};
  const P=findPath(id);if(P){let L=0;while(L<S.path.length&&L<P.length&&S.path[L].id===P[L].id)L++;const outs=S.path.length-L,c=outs+P.length-L;if(!best||!outs||c<best.c)best={c,outs,ins:P.slice(L)};}
  if(!best)return jumpTo(id);const fast=best.c>4;S.wave=[];zFocus=-1;
  for(let i=0;i<best.outs;i++)queue.push({out:1,fast});best.ins.forEach(e=>queue.push({hot:e.hot,fast,prep:1}));}
function zout(n){if(anim||queue.length||n===0)return;S.wave=[];zFocus=-1;for(let i=0;i<(n||1);i++)queue.push({out:1});}
function setTheme(n){T=TH[n];document.documentElement.className=n;$('#theme').textContent=n==='papel'?'fósforo':'papel';try{localStorage.setItem('c2si-tema',n);}catch(e){}}
function hotAt(x,y){if(cur()==='cmos'&&S.cmosTest.on)return null;return SCN[cur()].hots.filter(h=>x>=h.x-14&&x<=h.x+h.w+14&&y>=h.y-14&&y<=h.y+h.h+14).sort((p,q)=>p.w*p.h-q.w*q.h)[0]||null;}
function pt(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left-ox)/k,(e.clientY-r.top-oy)/k];}
$('#crumbs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)zout(S.path.length-1-(+b.dataset.i));});
$('#zin').addEventListener('click',()=>zin());$('#zout').addEventListener('click',()=>zout());
$('#ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(b)ctlAct(b.dataset.act,b.dataset.v);});
$('#ctl').addEventListener('input',e=>{
  if(e.target.id==='vgs'){const was=S.mv.manual;S.mv.manual=true;S.mv.v=+e.target.value;if(!was){renderCtl();const r=$('#vgs');if(r)r.focus();}}
  if(e.target.id==='temp'){S.temp=+e.target.value;const tv=$('#temp-val');if(tv)tv.textContent=S.temp+' K';syncUrl();}
  if(e.target.id==='scrub'&&DUR[cur()]){if(cur()==='dec')S.dc.m=0;if(cur()==='ff'&&!S.ch.on)S.ff.man=false;const st=clk(cur()),d=DUR[cur()](),tot=d.reduce((x,y)=>x+y,0);st.t=Math.min(tot-.01,(+e.target.value/100)*tot);st.until=0;st.run=false;S.wave=[];if(cur()==='mapa')S.mm.sel=-1;}
});
$('#ctl').addEventListener('change',e=>{if(e.target.id==='scrub')renderCtl();});
$('#asm-cancel').addEventListener('click',closeAsmEd);
$('#asm-save').addEventListener('click',()=>{
  const raw=$('#asm-txt').value,res=parseAsm(raw);
  if(res.err){$('#asm-err').textContent=res.err;return;}
  PROGS[4].code=res.code;PROGS[4].raw=raw;segKey='';uopKey='';
  setProg(4);renderCtl();closeAsmEd();
});
$('#mapb').addEventListener('click',()=>openMap(true));
$('#map').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.reset){if(!b.dataset.armed&&nDone()){b.dataset.armed='1';b.textContent='apagar as respostas? toque de novo';return;}resetCh();chrome();openMap(true);return;}if(b.dataset.go)goTo(b.dataset.go);openMap(false);});
$('#chal').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=cur(),C=CH[id];
  if(b.dataset.next){const nx=nextCh();if(nx)jumpTo(nx);return;}
  if(b.dataset.reset){if(!S.ch.armed&&nDone()&&nDone()<nTot()){S.ch.armed=true;chrome();return;}resetCh();const f=sceneOrder().find(k=>CH[k]);if(f===cur())chrome();else jumpTo(f);return;}
  S.ch.armed=false;
  if(S.ch.res[id])return;
  if(b.dataset.confirm){answer(id,!!C.check());return;}
  if(b.dataset.pick!==undefined){const i=+b.dataset.pick;answer(id,i===C.ans,i);}});
$('#helpb').addEventListener('click',()=>toggleHelp());$('#zr').addEventListener('click',viewReset);$('#capt').addEventListener('click',()=>$('#capt').classList.toggle('open'));$('#help-x').addEventListener('click',()=>toggleHelp(false));
document.addEventListener('fullscreenchange',()=>{$('#fs').textContent=document.fullscreenElement?'sair da tela cheia':'tela cheia';});
if(document.fullscreenEnabled)$('#fs').addEventListener('click',()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{});}catch(e){}});else $('#fs').hidden=true;
$('#theme').addEventListener('click',()=>setTheme(T===TH.papel?'fosforo':'papel'));
$('#vals').addEventListener('submit',e=>e.preventDefault());
['a','b'].forEach(n=>$('#in-'+n).addEventListener('blur',e=>{if(e.target.value!==String(S[n]))e.target.value=S[n];}));
['a','b'].forEach(n=>$('#in-'+n).addEventListener('input',e=>{const v=Math.max(0,Math.min(255,parseInt(e.target.value,10)||0));S[n]=v;
  if(e.target.value!==''&&String(v)!==e.target.value)e.target.value=v;
  ['cpu','alu','reg','datapath'].forEach(id=>{const q=clk(id);q.t=id==='alu'&&!q.run?aluReady():0;q.until=0;});S.wave=[];loadBit();syncUrl();if(S.ch.on)chrome();}));
/* pinça e arrasto: ampliam a cena sem trocar de nível */
function viewReset(){uz=1;upx=upy=0;const b=$('#zr');if(b)b.hidden=true;}
function viewZoom(nz,mx,my){const r=cv.getBoundingClientRect(),x=mx-r.left,y=my-r.top,vx=(x-ox)/k,vy=(y-oy)/k,k0=Math.min(W,H)/800;uz=Math.max(1,Math.min(4,nz));const nk=k0*uz;upx=x-vx*nk-(W-800*nk)/2;upy=y-vy*nk-(H-800*nk)/2;if(uz===1)upx=upy=0;$('#zr').hidden=uz===1;}
const ptrs=new Map();let pinch=null,drag=null;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,uz};drag=null;}
  else if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,px:upx,py:upy,mv:false};});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];viewZoom(pinch.uz*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d,(a[0]+b[0])/2,(a[1]+b[1])/2);panT=Date.now();}
  else if(drag&&uz>1){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.mv||Math.hypot(dx,dy)>8){drag.mv=true;upx=drag.px+dx;upy=drag.py+dy;panT=Date.now();}}});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)drag=null;}));
cv.addEventListener('dblclick',()=>{if(uz>1)viewReset();});
cv.addEventListener('click',e=>{if(anim||Date.now()-panT<350)return;const [x,y]=pt(e);
  for(const z of zones){const hit=z.box?(x>=z.box[0]&&x<=z.box[0]+z.box[2]&&y>=z.box[1]&&y<=z.box[1]+z.box[3]):Math.hypot(x-z.x,y-z.y)<=z.r;if(hit){z.fn();return;}}
  const h=hotAt(x,y);if(h)zin(h);});
cv.addEventListener('mousemove',e=>{if(anim){cv.style.cursor='default';cv.title='';return;}
  const [x,y]=pt(e),z=zones.some(q=>q.box?(x>=q.box[0]&&x<=q.box[0]+q.box[2]&&y>=q.box[1]&&y<=q.box[1]+q.box[3]):Math.hypot(x-q.x,y-q.y)<=q.r),h=!z&&hotAt(x,y);
  cv.style.cursor=z||h?'pointer':'default';cv.title=h?'Abrir: '+SCN[h.to].n:'';});
cv.addEventListener('mouseleave',()=>{cv.title='';});
let wl=0;stage.addEventListener('wheel',e=>{if(e.target.closest&&e.target.closest('#help'))return;e.preventDefault();if(e.ctrlKey){viewZoom(uz*Math.exp(-e.deltaY/120),e.clientX,e.clientY);return;}const n=Date.now();if(anim||n-wl<500||Math.abs(e.deltaY)<4)return;wl=n;if(e.deltaY<0){const [x,y]=pt(e);zin(hotAt(x,y));}else zout();},{passive:false});
cv.addEventListener('focus',()=>{zFocus=zones.length?0:-1;});
cv.addEventListener('pointerdown',()=>{kbdNav=false;});
cv.addEventListener('blur',()=>{zFocus=-1;});
document.addEventListener('keydown',e=>{if(e.key==='Tab')kbdNav=true;if(!$('#asm-ed').hidden){if(e.key==='Escape')closeAsmEd();return;}
if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.key==='?'||e.key==='h'){toggleHelp();e.preventDefault();return;}if(e.key==='Escape'&&!$('#help').hidden){toggleHelp(false);e.preventDefault();return;}if(!$('#map').hidden){if(e.key==='Escape'||e.key==='m')openMap(false);return;}
  if(!$('#help').hidden&&e.key!=='Tab')return;
  if(document.activeElement===cv&&zones.length&&$('#help').hidden){
    if(e.key==='Tab'){if(!e.shiftKey&&zFocus<zones.length-1){zFocus++;e.preventDefault();return;}if(e.shiftKey&&zFocus>0){zFocus--;e.preventDefault();return;}}
    if((e.key==='Enter'||e.key===' ')&&zFocus>=0&&zFocus<zones.length){zones[zFocus].fn();e.preventDefault();return;}
  }
  const has=a=>!!document.querySelector(`#ctl [data-act="${a}"]`);
  if(e.key===' '&&e.target.tagName!=='BUTTON'){if(has('pp'))ctlAct('pp');e.preventDefault();}if((e.key==='.'||e.key==='n')&&has('step')){ctlAct('step');e.preventDefault();}if(e.key===','&&has('prev')){ctlAct('prev');e.preventDefault();}if(e.key==='m')openMap(true);if(e.key==='d')ctlAct('chal');if(e.key==='v')setTheme(T===TH.papel?'fosforo':'papel');if(e.key==='f'&&!$('#fs').hidden)$('#fs').click();if(['ArrowDown','ArrowRight','+','='].includes(e.key)){zin();e.preventDefault();}if(['ArrowUp','ArrowLeft','-','Escape'].includes(e.key)){zout();e.preventDefault();}});
function syncUrl(){try{const h=cur();if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h);}catch(e){}}
function applyHash(){return location.hash.slice(1).split('?')[0];}
function jump(){const id=applyHash();applyLayout();loadBit();if(SCN[id]&&id!==cur())jumpTo(id);else chrome();}
window.addEventListener('hashchange',jump);
(function(){let th='papel';try{th=localStorage.getItem('c2si-tema')||'papel';const d=JSON.parse(localStorage.getItem('c2si-prova2')||'{}');if(d.draw)for(const q in d.draw)if(POOL[q]&&d.draw[q]>=0&&d.draw[q]<POOL[q].length)S.ch.draw[q]=d.draw[q];if(d.res)for(const q in d.res){const v=d.res[q];if(POOL[q]&&v&&typeof v.ok==='boolean'&&v.qi===S.ch.draw[q])S.ch.res[q]=v;}}catch(e){}
  drawCh(false);saveCh();
  const id=applyHash();applyLayout();setTheme(TH[th]?th:'papel');
  const p=SCN[id]&&findPath(id);if(p)S.path=p;loadBit();chrome();requestAnimationFrame(loop);})();
</script>
